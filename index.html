            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-medium text-slate-400 flex items-center gap-1"><i class="fa-regular fa-clock text-amber-400"></i> الحساب الجاهز</span>

                    <div class="flex flex-col items-center gap-1">

                    <!-- لعبة GTA San Andreas -->

                        <span class="text-[10px] text-slate-400">GTA: SA</span>

            <div class="mb-3">

                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl p-2.5 shadow-inner">
                    <button onclick="copyText('account-email', this)" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5"><i class="fa-regular fa-copy"></i> نسخ</button>
                    <span dir="ltr" id="account-email" class="text-slate-200 font-mono text-sm select-all tracking-wider">liyr@js001.club</span>

                    <span dir="ltr" id="account-pass" class="text-slate-200 font-mono text-sm select-all tracking-wider">y3YJy5gxF9</span>

    <footer class="w-full text-center text-xs text-slate-500 pb-2">جميع الحقوق محفوظة &copy; Kurd0oAccounts</footer>
    <script>
        function copyText(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> تم النسخ';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 1500);
            });
        }
    </script>
</body>
