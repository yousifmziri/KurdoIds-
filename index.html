<!DOCTYPE html>
<html lang="ku" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Gold Game | Kurd0o</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;800&display=swap');
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: #060504; 
            background-image: radial-gradient(circle at 50% 0%, rgba(191, 149, 63, 0.15) 0%, transparent 70%);
            color: #F3F4F6; 
            overflow: hidden;
            touch-action: none;
        }
        .cyber-gold { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #AA771C); }
        .gold-text { background: linear-gradient(135deg, #FBF5B7, #BF953F, #AA771C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cyber-border { border: 1px solid rgba(191, 149, 63, 0.35); }
        .cyber-glow { box-shadow: 0 0 25px rgba(191, 149, 63, 0.2); }
    </style>
</head>
<body class="h-screen flex flex-col justify-between items-center p-3 select-none">

    <!-- الهيدر والنتيجة -->
    <div class="w-full max-w-sm flex justify-between items-center bg-slate-900/80 backdrop-blur cyber-border rounded-xl p-3 z-10">
        <div>
            <span class="text-[10px] text-amber-400 block font-mono">CYBER GAME</span>
            <h1 class="text-xs font-bold gold-text">Kurd0o Space</h1>
        </div>
        <div class="text-left">
            <span class="text-[10px] text-slate-400 block">النقاط / خاال</span>
            <span id="score-val" class="text-base font-extrabold text-amber-400 font-mono">0</span>
        </div>
    </div>

    <!-- شاشة اللعبة (Canvas) -->
    <div class="relative w-full max-w-sm flex-1 my-2 bg-slate-950 cyber-border rounded-2xl overflow-hidden cyber-glow flex items-center justify-center">
        
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- شاشة البداية / إعادة اللعب -->
        <div id="start-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-5 text-center z-20">
            <div class="w-16 h-16 cyber-gold rounded-2xl flex items-center justify-center shadow-lg mb-3 animate-bounce">
                <i class="fa-solid fa-rocket text-2xl text-slate-950"></i>
            </div>
            <h2 class="text-base font-extrabold gold-text mb-1">لعبة تحدي الفضاء</h2>
            <p class="text-[11px] text-slate-400 mb-4">جمع القطع الذهبية وتفادى الاصطدام بالنيازك!</p>
            <button onclick="startGame()" class="w-full py-3 cyber-gold text-slate-950 font-extrabold text-xs rounded-xl shadow-lg transition transform hover:scale-105">
                بدء اللعبة (دەستپێکرنا یاریێ)
            </button>
        </div>

        <!-- شاشة خسارة اللعبة -->
        <div id="game-over-screen" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-sm flex flex-col items-center justify-center p-5 text-center z-20">
            <div class="w-14 h-14 bg-red-500/20 border border-red-500 text-red-400 rounded-2xl flex items-center justify-center mb-3">
                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
            <h2 class="text-sm font-bold text-white mb-1">انتهت اللعبة! (ياري تەمام بوو)</h2>
            <p class="text-[11px] text-slate-400 mb-3">النقاط النهائية: <span id="final-score" class="text-amber-400 font-bold">0</span></p>
            <button onclick="startGame()" class="w-full py-3 cyber-gold text-slate-950 font-extrabold text-xs rounded-xl shadow-lg transition">
                إعادة المحاولة (دوبارە لێدان)
            </button>
        </div>

    </div>

    <!-- أزرار التحكم بالأسفل -->
    <div class="w-full max-w-sm flex gap-3 z-10">
        <button id="left-btn" class="flex-1 py-3 bg-slate-900 cyber-border rounded-xl text-amber-400 font-bold text-sm active:bg-amber-500 active:text-slate-950 transition">
            <i class="fa-solid fa-arrow-left"></i> يسار
        </button>
        <button id="right-btn" class="flex-1 py-3 bg-slate-900 cyber-border rounded-xl text-amber-400 font-bold text-sm active:bg-amber-500 active:text-slate-950 transition">
            يمين <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gamePlaying = false;
        let score = 0;
        let player, coins, obstacles, gameInterval, spawnerInterval;

        function initGame() {
            player = {
                x: canvas.width / 2 - 20,
                y: canvas.height - 70,
                width: 40,
                height: 40,
                speed: 6,
                dx: 0
            };
            coins = [];
            obstacles = [];
            score = 0;
            document.getElementById('score-val').innerText = score;
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            initGame();
            gamePlaying = true;
            
            if (gameInterval) clearInterval(gameInterval);
            if (spawnerInterval) clearInterval(spawnerInterval);

            gameInterval = setInterval(updateGame, 1000 / 60);
            spawnerInterval = setInterval(spawnItems, 900);
        }

        function spawnItems() {
            if (!gamePlaying) return;
            const isGold = Math.random() > 0.3;
            const size = isGold ? 25 : 30;
            const item = {
                x: Math.random() * (canvas.width - size),
                y: -50,
                size: size,
                speed: 3 + Math.random() * 4,
                isGold: isGold
            };

            if (isGold) {
                coins.push(item);
            } else {
                obstacles.push(item);
            }
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // رسم المركبة
            ctx.fillStyle = '#BF953F';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 10);
            ctx.fill();
            ctx.fillStyle = '#FCF6BA';
            ctx.fillRect(player.x + 15, player.y - 10, 10, 12);

            // الذهب
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.y += c.speed;

                ctx.fillStyle = '#FCF6BA';
                ctx.beginPath();
                ctx.arc(c.x + c.size/2, c.y + c.size/2, c.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#BF953F';
                ctx.font = 'bold 12px Vazirmatn';
                ctx.fillText('$', c.x + c.size/2 - 4, c.y + c.size/2 + 4);

                if (
                    player.x < c.x + c.size &&
                    player.x + player.width > c.x &&
                    player.y < c.y + c.size &&
                    player.y + player.height > c.y
                ) {
                    score += 10;
                    document.getElementById('score-val').innerText = score;
                    coins.splice(i, 1);
                    continue;
                }

                if (c.y > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            // النيازك
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += o.speed;

                ctx.fillStyle = '#EF4444';
                ctx.beginPath();
                ctx.arc(o.x + o.size/2, o.y + o.size/2, o.size/2, 0, Math.PI * 2);
                ctx.fill();

                if (
                    player.x < o.x + o.size - 5 &&
                    player.x + player.width > o.x + 5 &&
                    player.y < o.y + o.size - 5 &&
                    player.y + player.height > o.y + 5
                ) {
                    gameOver();
                }

                if (o.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function gameOver() {
            gamePlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnerInterval);
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        leftBtn.addEventListener('touchstart', () => { player.dx = -player.speed; });
        leftBtn.addEventListener('touchend', () => { player.dx = 0; });
        leftBtn.addEventListener('mousedown', () => { player.dx = -player.speed; });
        leftBtn.addEventListener('mouseup', () => { player.dx = 0; });

        rightBtn.addEventListener('touchstart', () => { player.dx = player.speed; });
        rightBtn.addEventListener('touchend', () => { player.dx = 0; });
        rightBtn.addEventListener('mousedown', () => { player.dx = player.speed; });
        rightBtn.addEventListener('mouseup', () => { player.dx = 0; });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.dx = -player.speed;
            if (e.key === 'ArrowRight') player.dx = player.speed;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.dx = 0;
        });
    </script>
</body>
</html>
