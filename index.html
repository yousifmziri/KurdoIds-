<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurdolds - حسابات Apple ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <header class="text-center mb-6 pt-4">
            <h1 class="text-2xl font-bold text-yellow-400">Kurdolds</h1>
            <p class="text-gray-400 text-sm mt-1">حسابات Apple ID موثوقة</p>
        </header>

        <div id="accounts-list" class="space-y-3">
            <p class="text-center text-gray-500 py-8">جاري تحميل الحسابات...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xvakyzxlxtbldvdxoios.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_81lGi6fwhS2kQekWxDEJEQ_vpheRygF';

        async function loadAccounts() {
            const container = document.getElementById('accounts-list');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/accounts?select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) throw new Error('فشل الاتصال بقاعدة البيانات');

                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-400 py-8">لا توجد حسابات حالياً.</p>';
                    return;
                }

                container.innerHTML = data.map(acc => `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-yellow-300">${acc.title || 'حساب Apple ID'}</span>
                        </div>
                        <div class="text-sm text-gray-300 space-y-1">
                            <p><strong>البريد:</strong> <span dir="ltr" class="select-all bg-gray-900 px-2 py-0.5 rounded text-blue-400 inline-block">${acc.email}</span></p>
                            <p><strong>كلمة المرور:</strong> <span dir="ltr" class="select-all bg-gray-900 px-2 py-0.5 rounded text-green-400 inline-block">${acc.password}</span></p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-400 py-8">خطأ: ${err.message}</p>`;
            }
        }

        loadAccounts();
    </script>
</body>
</html>
